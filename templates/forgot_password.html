{% extends 'blank_layout.html' %}
{% block content %}
<section class="auth-section">
  <div class="login-card">
    <h2>Forgot Password</h2>

    <form method="post">
      {% csrf_token %}
      {{ form.email.label_tag }}
      {{ form.email }}

      <button type="submit" class="btn btn-primary mt-3">
        Send Reset Link
      </button>
    </form>
  </div>
</section>
{% endblock %}
